bio: >
  I want to build AI that feels a little more human. People have things like a sense of
  who they are and reasons to keep going, and I try to give some of that to AI. It all
  starts with one question I keep coming back to: what makes us human?
about: >
  I'm a fourth-year student at GIST, and I do research in the DS Lab. I like teaching
  computers to learn from data, and lately I've gotten curious about how the brain and
  the mind work, because that can help us build AI that acts more like a person. Before
  this, I worked in the Language Cognition and Brain Lab (LCBL).
