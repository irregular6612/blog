bio: >
  I want to build AI that feels a little more human — and I keep coming back to one
  question: what makes us human?
about: >
  The question I most want to pursue is whether an AI can behave as if it has a self and
  desires of its own — not merely whether it can solve problems. Most AI research today
  is aimed at improving problem-solving ability, but accuracy alone will not get us to the
  human-like AI I ultimately want to build. People are not moved by correctness alone:
  when we fail we revise our hypotheses, we retry the actions that matter, and we hold
  onto a goal and keep going even when no one tells us to. I want to read these behaviors
  through the lens of self, motivation, and drive — and turn them into measurable problems
  that AI research can actually test.
